<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c2452">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; media-src 'self' blob:; form-action 'none'; base-uri 'none'">
<meta name="description" content="Beach Runner, modern edition. A free side-scrolling game along a Gulf Coast boardwalk. Optionally put your own face on the runner. Your photo never leaves your phone.">
<title>Beach Runner</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="320" height="180" aria-label="Beach Runner game"></canvas>

    <div id="hudBtns">
      <button id="btnPause" class="hbtn" type="button" aria-label="Pause" tabindex="-1" hidden>
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><rect x="3" y="2" width="3.4" height="12" rx="1.2" fill="currentColor"/><rect x="9.6" y="2" width="3.4" height="12" rx="1.2" fill="currentColor"/></svg>
      </button>
      <button id="btnMute" class="hbtn" type="button" aria-label="Mute sound" aria-pressed="false" tabindex="-1">
        <svg id="icoSound" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11.2 5.2q1.9 2.8 0 5.6M13.2 3.4q3.6 4.6 0 9.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <svg id="icoMuted" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" hidden><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11.4 5.6l3.6 4.8M15 5.6l-3.6 4.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- START SCREEN -->
    <div id="startScreen" class="screen">
      <div class="panel">
        <img id="brandLogo" alt="" hidden>
        <p id="poweredBy" class="kicker"></p>
        <h1 id="gameTitle">Beach Runner</h1>
        <p id="tagline" class="sub"></p>
        <div class="avatarRow">
          <canvas id="avatarPrev" width="200" height="260" aria-label="Your character"></canvas>
          <div class="avatarBtns">
            <button id="btnPlay" class="btn big" type="button">Play</button>
            <button id="btnFace" class="btn glass" type="button">Add your face</button>
            <div id="faceChoice" class="faceChoice" hidden>
              <label class="btn small glass" for="fileCam">Take a selfie</label>
              <label class="btn small glass" for="fileGal">Choose a photo</label>
            </div>
            <button id="btnRemove" class="btn ghost" type="button" hidden>Remove photo</button>
          </div>
        </div>
        <p id="photoNote" class="note"></p>
        <div class="seg" role="group" aria-label="Controls">
          <span>Controls</span>
          <button id="modeAuto" type="button">Auto-run</button>
          <button id="modeManual" type="button">Manual</button>
        </div>
        <p id="helpText" class="help"></p>
        <p id="startDisclaimer" class="disc"></p>
      </div>
    </div>

    <!-- PAUSE -->
    <div id="pauseScreen" class="screen dim" hidden>
      <div class="panel small">
        <h2>Paused</h2>
        <button id="btnResume" class="btn big" type="button">Resume</button>
        <button id="btnQuit" class="btn ghost" type="button">Quit to menu</button>
      </div>
    </div>

    <!-- WIN -->
    <div id="winScreen" class="screen dim" hidden>
      <div class="panel">
        <h2 class="win">You made it!</h2>
        <p class="sub" id="winSub"></p>
        <table class="stats" id="winStats"></table>
        <button id="btnWinAgain" class="btn big" type="button">Play again</button>
        <div class="cta">
          <p id="winCtaHead"></p>
          <a id="winCta" class="btn call"></a>
          <p class="studio"><span id="winStudioHead"></span> <a id="winStudio" target="_blank" rel="noopener"></a></p>
        </div>
        <button id="btnWinMenu" class="btn ghost" type="button">Back to menu</button>
      </div>
    </div>

    <!-- GAME OVER -->
    <div id="overScreen" class="screen dim" hidden>
      <div class="panel">
        <h2 class="lose">Game over</h2>
        <p class="sub" id="overSub"></p>
        <table class="stats" id="overStats"></table>
        <button id="btnOverAgain" class="btn big" type="button">Try again</button>
        <div class="cta">
          <p id="overCtaHead"></p>
          <a id="overCta" class="btn call"></a>
          <p class="studio"><span id="overStudioHead"></span> <a id="overStudio" target="_blank" rel="noopener"></a></p>
        </div>
        <button id="btnOverMenu" class="btn ghost" type="button">Back to menu</button>
      </div>
    </div>

    <!-- CROP -->
    <div id="cropModal" class="screen dim" hidden role="dialog" aria-modal="true" aria-label="Crop your photo">
      <div class="panel crop">
        <h2>Fit your face</h2>
        <p class="sub">Drag to move. Pinch or use the slider to zoom.</p>
        <div class="cropWrap"><canvas id="cropCanvas" width="300" height="300"></canvas></div>
        <div class="zoomRow">
          <label for="zoom">Zoom</label>
          <input id="zoom" type="range" min="100" max="400" value="100">
          <button id="btnAuto" class="btn small glass" type="button">Auto center</button>
        </div>
        <div class="cropOpts">
          <label class="chk"><input id="optRemember" type="checkbox"> Remember on this phone</label>
        </div>
        <div class="cropPrev"><canvas id="cropPrev" width="100" height="130" aria-label="Preview"></canvas><span id="cropNote" class="note"></span></div>
        <p id="cropErr" class="err" hidden></p>
        <div class="btnRow">
          <button id="btnCropUse" class="btn big" type="button">Use this</button>
          <button id="btnCropCancel" class="btn ghost" type="button">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <div id="controls">
    <div id="padLeft">
      <button id="btnLeft" class="cbtn" type="button" aria-label="Move left" tabindex="-1"><i class="tri l"></i></button>
      <button id="btnRight" class="cbtn" type="button" aria-label="Move right" tabindex="-1"><i class="tri r"></i></button>
    </div>
    <div id="padRight">
      <button id="btnJump" class="cbtn jump" type="button" aria-label="Jump" tabindex="-1"><span>Jump</span></button>
    </div>
  </div>

  <footer id="foot"><span id="footText"></span> <a id="footStudio" target="_blank" rel="noopener"></a></footer>
</div>

<input id="fileCam" type="file" accept="image/*" capture="user" hidden>
<input id="fileGal" type="file" accept="image/*" hidden>

<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
